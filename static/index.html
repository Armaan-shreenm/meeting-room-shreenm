<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17171C">
<title>NM Meet — Mumbai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   NM Meet — one brand colour (#F5A300) with a warm neutral ground.
   Soft corners, real shadows, movement on everything that responds.
   Mobile first: the grid scrolls sideways under a pinned time column, and
   the booking panel becomes a bottom sheet.
   ========================================================================== */
:root{
  --brand:#F5A300;
  --brand-600:#DB9100;
  --brand-200:#FFE2A6;
  --brand-50:#FFF7E6;

  --ink:#1B1A17;
  --ink-2:#55524B;
  --muted:#8C8880;

  --page:#FAF8F5;
  --card:#FFFFFF;
  --sunk:#F2EFEA;
  --line:#E9E4DC;
  --line-2:#F1EDE6;
  --dark:#17171C;
  --dark-2:#26252C;

  --ok:#0E9C92;
  --no:#D6452F;

  --spark:#E39A2E; --power:#DD4F3A; --pulse:#0E9C92; --ignite:#C5468A; --switch:#4F5FDB;

  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(27,26,23,.05), 0 1px 3px rgba(27,26,23,.04);
  --sh-2:0 4px 12px rgba(27,26,23,.07), 0 2px 4px rgba(27,26,23,.04);
  --sh-3:0 18px 44px rgba(27,26,23,.14), 0 4px 12px rgba(27,26,23,.07);
  --ease:cubic-bezier(.4,0,.2,1);
  --slot-h:46px; --time-w:66px; --gut:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--page);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 var(--gut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{background:var(--dark);color:#F3F1EC;position:sticky;top:0;z-index:30}
.topin{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.bolt{width:30px;height:30px;border-radius:9px;background:var(--brand);
  display:grid;place-items:center;color:#241800;font-size:15px;font-weight:700;flex:none;
  box-shadow:0 2px 10px rgba(245,163,0,.35)}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.topin .sp{flex:1}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--dark-2);color:var(--brand);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:1px solid #35333c}
.whoname{font-size:13.5px;font-weight:500;color:#D9D5CD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.signout{font-size:13px;color:#98938B;padding:7px 11px;border-radius:var(--r-sm);transition:.16s var(--ease)}
.signout:hover{color:#fff;background:rgba(255,255,255,.08)}

/* ---------- toolbar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:18px 0 14px;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:4px;box-shadow:var(--sh-1)}
.nav{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--ink-2);font-size:17px;transition:.16s var(--ease)}
.nav:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.nav:disabled{opacity:.28;cursor:not-allowed}
.dlbl{padding:0 12px;text-align:center;min-width:132px}
.dlbl b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.dlbl span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.dlbl span.is-today{color:var(--brand-600);font-weight:600}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:var(--r);height:42px;padding:0 15px;
  font-size:14px;font-weight:500;color:var(--ink-2);box-shadow:var(--sh-1);transition:.16s var(--ease)}
.tbtn:hover:not(:disabled){background:var(--sunk);transform:translateY(-1px)}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.bar .sp{flex:1}
.cta{background:var(--brand);color:#241800;border-radius:var(--r);height:42px;padding:0 20px;
  font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 2px 10px rgba(245,163,0,.32);transition:.18s var(--ease)}
.cta:hover{background:#FFB524;transform:translateY(-1px);box-shadow:0 6px 18px rgba(245,163,0,.4)}
.cta:active{transform:translateY(0)}

/* ---------- closed-day banner ---------- */
.banner{display:none;align-items:center;gap:10px;background:var(--brand-50);
  border:1px solid var(--brand-200);border-radius:var(--r);padding:12px 15px;
  margin-bottom:14px;font-size:14px;color:#7A5200}
.banner.on{display:flex}
.banner b{font-weight:600}

/* ---------- board ---------- */
.board{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-2);overflow:hidden;margin-bottom:14px}
.scroll{overflow:auto;max-height:min(64vh,620px);position:relative;
  scrollbar-width:thin;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:#DCD6CC;border-radius:20px;border:3px solid var(--card)}
.sheet{display:grid;grid-template-columns:var(--time-w) repeat(5,minmax(124px,1fr));min-width:660px;position:relative}

.hcell{position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);
  padding:13px 12px;display:flex;align-items:center;gap:8px}
.hcell.corner{left:0;z-index:8;border-right:1px solid var(--line);justify-content:center}
.corner span{font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.rdot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.rname{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.rmin{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}

.tk{position:sticky;left:0;z-index:4;background:var(--card);border-right:1px solid var(--line);
  border-top:1px solid var(--line-2);display:flex;align-items:flex-start;justify-content:flex-end;
  padding:5px 9px 0 4px;font-size:11.5px;font-weight:500;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tk.hr{color:var(--ink-2);border-top-color:var(--line)}

.cell{border-top:1px solid var(--line-2);border-left:1px solid var(--line-2);
  position:relative;transition:background .14s var(--ease)}
.cell.hr{border-top-color:var(--line)}
.cell:not(.gone):hover{background:var(--brand-50);cursor:pointer}
.cell.gone{background:var(--sunk);cursor:default}

.run{margin:2px 3px;padding:7px 10px;border-radius:var(--r-sm);text-align:left;position:relative;
  overflow:hidden;z-index:2;display:block;
  background:color-mix(in srgb,var(--c) 11%,#fff);
  border:1px solid color-mix(in srgb,var(--c) 28%,#fff);
  border-left:3px solid var(--c);
  transition:.16s var(--ease)}
.run:hover{background:color-mix(in srgb,var(--c) 18%,#fff);transform:translateY(-1px);box-shadow:var(--sh-2)}
.run.mine{border-left-width:5px}
.run .rt{font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .rm{font-size:11px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.run .rw{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mytag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--brand-600);
  background:var(--brand-50);border:1px solid var(--brand-200);border-radius:20px;padding:0 5px;margin-left:5px;vertical-align:1px}

.now{position:absolute;left:0;right:0;height:0;z-index:5;pointer-events:none}
.now::before{content:"";position:absolute;left:var(--time-w);right:0;top:0;height:2px;background:var(--no);opacity:.65}
.now::after{content:"";position:absolute;left:calc(var(--time-w) - 4px);top:-4px;width:9px;height:9px;
  border-radius:50%;background:var(--no)}

.key{display:flex;gap:16px;flex-wrap:wrap;padding:0 2px 36px;font-size:12.5px;color:var(--muted);align-items:center}
.key i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}

/* ---------- panel / bottom sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(23,23,28,.5);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .25s var(--ease);z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.pan{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:50;
  transform:translateX(101%);transition:transform .32s var(--ease);
  display:flex;flex-direction:column;box-shadow:var(--sh-3)}
.pan.on{transform:none}
.ph{background:var(--dark);color:#F3F1EC;padding:18px 22px;display:flex;align-items:flex-start;gap:12px;flex:none}
.ph h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.ph p{margin:2px 0 0;font-size:12.5px;color:#98938B}
.shut{margin-left:auto;color:#98938B;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:20px;line-height:1;transition:.16s var(--ease);flex:none}
.shut:hover{background:rgba(255,255,255,.1);color:#fff}
.pb{padding:20px 22px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.pf{padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:10px;background:var(--card);flex:none}

.rail{display:flex;gap:5px;padding:14px 22px 0;flex:none}
.rail i{flex:1;height:4px;border-radius:20px;background:var(--line);transition:.3s var(--ease)}
.rail i.done{background:var(--brand-200)}
.rail i.at{background:var(--brand)}
.stepttl{padding:14px 22px 0;flex:none}
.stepttl b{display:block;font-size:19px;font-weight:650;letter-spacing:-.02em}
.stepttl span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- room picker ---------- */
.rlist{display:grid;gap:9px}
.rpick{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);
  padding:14px 15px;text-align:left;display:flex;align-items:center;gap:12px;position:relative;
  transition:.18s var(--ease)}
.rpick::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;
  border-radius:0 4px 4px 0;background:var(--c);transition:.18s var(--ease)}
.rpick:hover{border-color:var(--brand-200);background:var(--brand-50);transform:translateY(-1px)}
.rpick[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-50);box-shadow:0 0 0 3px rgba(245,163,0,.16)}
.rpick[aria-pressed="true"]::before{top:6px;bottom:6px;width:5px}
.rpick b{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.rpick .cap{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rpick b{display:block}
.rpick .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;flex:none;
  display:grid;place-items:center;background:var(--brand);color:#241800;font-size:12px;font-weight:700;
  opacity:0;transform:scale(.6);transition:.18s var(--ease)}
.rpick[aria-pressed="true"] .tick{opacity:1;transform:scale(1)}
.capnote{margin-top:12px;border:1px solid #F3C9C0;background:#FFF5F3;border-left:3px solid var(--no);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13px;color:#8C2A19;display:none}
.capnote.on{display:block}

/* ---------- calendar ---------- */
.cal{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card)}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.calhead span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;font-size:14px;font-weight:500;color:var(--ink);
  border:1.5px solid transparent;transition:.16s var(--ease);position:relative}
.day.pad{visibility:hidden}
.day:disabled{color:#C7C2B9;cursor:not-allowed}
.day.free:hover{background:var(--brand-50);border-color:var(--brand-200)}
.day[aria-pressed="true"]{background:var(--brand);color:#241800;font-weight:700;border-color:var(--brand);
  box-shadow:0 3px 10px rgba(245,163,0,.35)}
.day em{font-style:normal;font-size:9px;font-weight:600;letter-spacing:.03em;opacity:.75}
.day.shut em{color:var(--no);opacity:.9}
.day[aria-pressed="true"] em{opacity:.85}

/* ---------- time buttons ---------- */
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.t{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:11px 6px;
  font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  transition:.16s var(--ease)}
.t:hover:not(:disabled){border-color:var(--brand-200);background:var(--brand-50);transform:translateY(-1px)}
.t[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#241800;
  box-shadow:0 3px 10px rgba(245,163,0,.35)}
.t:disabled{color:#C7C2B9;background:var(--sunk);border-color:var(--line-2);cursor:not-allowed}
.t small{display:block;font-size:10px;font-weight:500;opacity:.7;margin-top:1px}
.tsec{margin-bottom:16px}
.tsec h4{margin:0 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.5}
.hint b{color:var(--ink-2);font-weight:600}

/* ---------- fields ---------- */
.f{margin-bottom:16px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:11px 12px;font-size:15px;background:var(--card);transition:.16s var(--ease)}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(245,163,0,.15)}
.f .sub{font-size:12px;color:var(--muted);margin-top:5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{background:var(--brand-50);border:1px solid var(--brand-200);border-radius:20px;padding:5px 6px 5px 11px;
  font-size:13px;color:#7A5200;display:flex;gap:5px;align-items:center;font-weight:500}
.tag button{color:#B98600;font-size:15px;line-height:1;width:18px;height:18px;border-radius:50%;
  display:grid;place-items:center;transition:.14s var(--ease)}
.tag button:hover{background:var(--brand-200);color:#5C3E00}

/* ---------- review ---------- */
.rev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.rev .row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line-2);font-size:14.5px}
.rev .row:first-child{border-top:0}
.rev .k{font-size:12px;font-weight:600;color:var(--muted);width:96px;flex:none;padding-top:2px}
.rev .v{flex:1;min-width:0}
.rev .v b{font-weight:600}
.notice{border:1px solid var(--brand-200);background:var(--brand-50);border-radius:var(--r);
  padding:13px 15px;margin-top:14px}
.notice b{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:#7A5200;margin-bottom:6px}
.notice ul{margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2)}
.notice li{margin-bottom:2px}

/* ---------- buttons ---------- */
.act{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 18px;
  font-size:15px;font-weight:600;transition:.18s var(--ease)}
.act:hover:not(:disabled){background:var(--sunk)}
.act.go{flex:1;background:var(--brand);border-color:var(--brand);color:#241800;
  box-shadow:0 2px 10px rgba(245,163,0,.32)}
.act.go:hover:not(:disabled){background:#FFB524;transform:translateY(-1px);box-shadow:0 6px 18px rgba(245,163,0,.4)}
.act.go:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.act.kill{color:var(--no);border-color:#F0C6BD}
.act.kill:hover{background:#FFF5F3}
.act.kill.armed{background:var(--no);border-color:var(--no);color:#fff}
.act.kill.armed:hover{background:#C13D29}

.dl dt{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-top:16px}
.dl dt:first-child{margin-top:0}
.dl dd{margin:4px 0 0;font-size:15px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--brand-50);color:#7A5200;border:1px solid var(--brand-200)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px) scale(.97);
  background:var(--dark);color:#F3F1EC;padding:13px 18px;border-radius:var(--r);font-size:14px;
  opacity:0;pointer-events:none;transition:.26s var(--ease);z-index:60;max-width:min(520px,92vw);
  box-shadow:var(--sh-3);border-left:3px solid var(--brand);line-height:1.45}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.bad{border-left-color:var(--no)}

/* ---------- loading ---------- */
.load{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;background:transparent;overflow:hidden;
  opacity:0;transition:opacity .2s}
.load.on{opacity:1}
.load::after{content:"";position:absolute;inset:0;width:40%;background:var(--brand);
  animation:slide 1.1s infinite var(--ease)}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.skel{background:linear-gradient(90deg,var(--sunk) 25%,#EDE9E3 50%,var(--sunk) 75%);
  background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- mobile ---------- */
@media (max-width:760px){
  :root{--gut:14px;--slot-h:44px;--time-w:56px}
  .topin{padding:11px 0}
  .whoname{display:none}
  .bar{padding:14px 0 12px;gap:8px}
  .daynav{flex:1}
  .dlbl{flex:1;min-width:0}
  .cta{width:100%;justify-content:center;order:3}
  .tbtn{padding:0 12px}
  .scroll{max-height:none}
  .sheet{min-width:600px}
  /* bottom sheet */
  .pan{top:auto;left:0;right:0;bottom:0;width:100%;height:92dvh;
    border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(101%)}
  .pan.on{transform:none}
  .ph{border-radius:var(--r-xl) var(--r-xl) 0 0}
  .times{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .toast{left:var(--gut);right:var(--gut);bottom:16px;transform:translateY(16px);max-width:none}
  .toast.on{transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="load" id="load"></div>

<header class="top"><div class="wrap"><div class="topin">
  <div class="logo"><span class="bolt">⌁</span><span class="brand">NM Meet</span></div>
  <span class="sp"></span>
  <div class="who">
    <span class="avatar" id="avatar"></span>
    <span class="whoname" id="who"></span>
    <button class="signout" id="signout">Sign out</button>
  </div>
</div></div></header>

<div class="wrap">
  <div class="bar">
    <div class="daynav">
      <button class="nav" id="prev" aria-label="Previous day">‹</button>
      <div class="dlbl"><b id="dBig">—</b><span id="dSml"></span></div>
      <button class="nav" id="next" aria-label="Next day">›</button>
    </div>
    <button class="tbtn" id="today">Today</button>
    <span class="sp"></span>
    <button class="cta" id="newBtn">＋ Book a room</button>
  </div>

  <div class="banner" id="banner"></div>

  <div class="board">
    <div class="scroll" id="scroll">
      <div class="sheet" id="sheet"></div>
      <div class="now" id="nowline" style="display:none"></div>
    </div>
  </div>

  <div class="key">
    <span><i style="background:#fff;border:1px solid var(--line)"></i>Free — tap to book</span>
    <span><i style="background:color-mix(in srgb,var(--pulse) 16%,#fff);border-left:3px solid var(--pulse)"></i>Booked</span>
    <span><i style="background:var(--sunk)"></i>Unavailable</span>
    <span id="hoursKey"></span>
  </div>
</div>

<div class="veil" id="veil"></div>

<aside class="pan" id="wiz" role="dialog" aria-modal="true" aria-labelledby="wh">
  <div class="ph"><div><h2 id="wh">Book a room</h2><p>Mumbai branch</p></div>
    <button class="shut" data-x aria-label="Close">×</button></div>
  <div class="rail" id="rail"></div>
  <div class="stepttl"><b id="stTitle"></b><span id="stSub"></span></div>
  <div class="pb" id="stBody"></div>
  <div class="pf">
    <button class="act" id="wBack">Back</button>
    <button class="act go" id="wNext">Next</button>
  </div>
</aside>

<aside class="pan" id="det" role="dialog" aria-modal="true" aria-labelledby="dh">
  <div class="ph"><div><h2 id="dh">Booking</h2><p id="dsub">—</p></div>
    <button class="shut" data-x aria-label="Close">×</button></div>
  <div class="pb dl" id="dBody"></div>
  <div class="pf">
    <button class="act" data-x style="flex:1">Close</button>
    <button class="act kill" id="drop">Cancel booking</button>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
/* ================= config, filled from the API ================= */
let ROOMS=[], DEPTS=[], DIR=[];
let ME='', ME_EMAIL=null, MY_ID=null;
const DEPT_ID={}, DIR_ID={};

let OPEN=9*60, SHUT=20*60, STEP=30, MINLEN=30, MAXLEN=240;
let LAST_DATE=null, CLOSED_DAYS=[0];
let SLOTS=[];
const rebuildSlots=()=>{SLOTS=[];for(let m=OPEN;m<SHUT;m+=STEP)SLOTS.push(m);};
rebuildSlots();

let bookings=[];
const loadedDays=new Set();
const dayInfo={};

/* ================= helpers ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>new Date(s+'T00:00:00');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const t24=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const t12=m=>{const h=Math.floor(m/60),mm=m%60,ap=h<12?'am':'pm',hh=h%12||12;
  return mm?`${hh}:${pad(mm)} ${ap}`:`${hh} ${ap}`;};
const hhmm=s=>{const p=String(s).split(':');return (+p[0])*60+(+p[1]);};
const room=id=>ROOMS.find(r=>r.id===id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const overlap=(a1,a2,b1,b2)=>a1<b2&&a2>b1;
const initials=n=>String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
let cursor=today();
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const isToday=s=>s===iso(new Date());
const isPast=s=>s<iso(new Date());
const isClosedDay=s=>CLOSED_DAYS.includes(fromIso(s).getDay()===0?0:fromIso(s).getDay());
const dayShut=s=>{const i=dayInfo[s];return i?i.closed:(isPast(s)||weekendShut(s));};
/* Monday=0 in the API, Sunday=0 in JS Date. Convert once, here. */
const weekendShut=s=>CLOSED_DAYS.includes((fromIso(s).getDay()+6)%7);
const beyondWindow=s=>LAST_DATE?s>LAST_DATE:false;

const on=s=>bookings.filter(b=>b.date===s);
const runsFor=(rid,ds)=>on(ds).filter(b=>b.room===rid).sort((a,b)=>a.s-b.s);
const isFree=(rid,ds,s,e)=>!bookings.some(b=>b.room===rid&&b.date===ds&&overlap(s,e,b.s,b.e));
const blockedAt=(rid,ds,m)=>runsFor(rid,ds).some(b=>m>=b.s&&m<b.e);
function capAfter(rid,ds,m){
  if(typeof W!=='undefined'&&W&&W.capFor===`${rid}|${ds}|${m}`&&W.cap!=null) return W.cap;
  const nxt=runsFor(rid,ds).find(b=>b.s>=m);
  return Math.min(nxt?nxt.s:SHUT, m+MAXLEN, SHUT);
}

/* ================= api ================= */
const OFFLINE='NM Meet is not reachable right now. Check your connection and try again.';
const cookie=n=>document.cookie.split('; ').map(c=>c.split('=')).find(([k])=>k===n)?.[1]??null;
const toLogin=()=>location.replace(`/login.html?next=${encodeURIComponent(location.pathname)}`);

let busy=0;
const setBusy=d=>{busy=Math.max(0,busy+d);document.getElementById('load').classList.toggle('on',busy>0);};

async function api(path,opts={}){
  const unsafe=opts.method&&!['GET','HEAD','OPTIONS'].includes(opts.method);
  setBusy(1);
  let res;
  try{
    res=await fetch(`/api${path}`,{...opts,credentials:'same-origin',headers:{
      'Content-Type':'application/json',
      ...(unsafe?{'X-CSRF-Token':cookie('nm_csrf')||''}:{}),
      ...(opts.headers||{})}});
  }catch(e){ setBusy(-1); const err=new Error(OFFLINE); err.status=0; throw err; }
  finally{ }
  setBusy(-1);
  let body=null;
  try{ body=await res.json(); }catch(e){}
  if(!res.ok){
    if(res.status===401){ toLogin(); }
    const err=new Error((body&&body.detail)||OFFLINE);
    err.status=res.status; err.body=body; throw err;
  }
  return body;
}

async function loadDay(ds,force){
  if(loadedDays.has(ds)&&!force) return;
  const a=await api(`/availability?date=${ds}`);
  OPEN=hhmm(a.open_time); SHUT=hhmm(a.close_time);
  STEP=a.slot_minutes; MINLEN=a.min_booking_minutes; MAXLEN=a.max_booking_minutes;
  LAST_DATE=a.last_bookable_date; CLOSED_DAYS=a.closed_weekdays;
  rebuildSlots();
  if(!ROOMS.length) ROOMS=a.rooms.map(r=>({id:r.id,n:r.name,v:r.colour_var,min:r.min_people}));
  bookings=bookings.filter(b=>b.date!==ds);
  a.rooms.forEach(r=>r.bookings.forEach(b=>bookings.push({
    id:b.id, room:r.id, date:ds, s:hhmm(b.entry), e:hhmm(b.exit),
    t:b.title, dept:b.department, host:b.host, by:b.booked_by, byId:b.booked_by_id})));
  dayInfo[ds]={closed:a.closed,reason:a.closed_reason,detail:a.closed_detail};
  loadedDays.add(ds);
}

async function refresh(){
  try{ await loadDay(iso(cursor),true); render(); }
  catch(e){ toast(e.message,true); }
}
async function ensureDay(ds){ try{ await loadDay(ds); }catch(e){ toast(e.message,true); } }

async function boot(){
  try{
    const me=await api('/me');
    ME_EMAIL=me.email; ME=me.full_name; MY_ID=me.id;
    document.getElementById('who').textContent=me.full_name;
    document.getElementById('avatar').textContent=initials(me.full_name);
    const [rs,ds,dr]=await Promise.all([api('/rooms'),api('/departments'),api('/directory')]);
    ROOMS=rs.map(r=>({id:r.id,n:r.name,v:r.colour_var,min:r.min_people}));
    DEPTS=ds.map(d=>d.name); ds.forEach(d=>DEPT_ID[d.name]=d.id);
    DIR=dr.map(u=>u.full_name); dr.forEach(u=>DIR_ID[u.full_name]=u.id);
    await refresh();
  }catch(e){ if(e.status!==401) toast(e.message,true); }
}

/* ================= grid ================= */
function render(){
  const d=cursor, ds=iso(d), m=nowM();
  const shut=dayShut(ds), info=dayInfo[ds]||{};

  document.getElementById('dBig').textContent=
    d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
  const sml=document.getElementById('dSml');
  sml.textContent=isToday(ds)?'Today':d.toLocaleDateString('en-IN',{year:'numeric'});
  sml.classList.toggle('is-today',isToday(ds));

  document.getElementById('prev').disabled = ds<=iso(new Date());
  document.getElementById('next').disabled = LAST_DATE ? ds>=LAST_DATE : false;
  document.getElementById('today').disabled = isToday(ds);
  document.getElementById('hoursKey').textContent=
    `${t12(OPEN)} to ${t12(SHUT)} · ${STEP} minute steps`;

  const banner=document.getElementById('banner');
  if(shut){
    banner.classList.add('on');
    banner.innerHTML = info.reason==='holiday'
      ? `<b>Closed —</b> ${esc(info.detail||'holiday')}. No rooms can be booked.`
      : info.reason==='past'
        ? `<b>Past.</b> This day has been and gone.`
        : `<b>Closed on Sundays.</b> Pick another day to book a room.`;
  } else banner.classList.remove('on');

  const sheet=document.getElementById('sheet');
  sheet.style.gridTemplateColumns=`var(--time-w) repeat(${ROOMS.length},minmax(124px,1fr))`;
  sheet.innerHTML='';

  const corner=document.createElement('div');
  corner.className='hcell corner'; corner.innerHTML='<span>Time</span>';
  sheet.appendChild(corner);
  ROOMS.forEach(r=>{
    const h=document.createElement('div');
    h.className='hcell'; h.style.setProperty('--c',`var(${r.v})`);
    h.innerHTML=`<i class="rdot"></i><span class="rname">${esc(r.n)}</span><span class="rmin">${r.min}+</span>`;
    sheet.appendChild(h);
  });

  SLOTS.forEach((mm,i)=>{
    const k=document.createElement('div');
    k.className='tk'+(mm%60===0?' hr':''); k.style.gridColumn=1; k.style.gridRow=i+2;
    k.textContent=mm%60===0?t12(mm):'';
    sheet.appendChild(k);
  });

  ROOMS.forEach((r,ci)=>{
    const list=runsFor(r.id,ds);
    const taken=new Array(SLOTS.length).fill(null);
    list.forEach(b=>{
      const si=SLOTS.findIndex(x=>x>=b.s);
      const ei=Math.min(Math.ceil((b.e-OPEN)/STEP),SLOTS.length);
      if(si<0)return;
      for(let i=si;i<ei;i++) taken[i]= i===si?b:'x';
    });
    SLOTS.forEach((mm,i)=>{
      const c=taken[i]; if(c==='x')return;
      if(c){
        const span=Math.max(1,Math.ceil((c.e-c.s)/STEP));
        const el=document.createElement('button');
        el.className='run'+(c.byId===MY_ID?' mine':'');
        el.style.setProperty('--c',`var(${r.v})`);
        el.style.gridColumn=ci+2; el.style.gridRow=`${i+2} / span ${span}`;
        el.innerHTML=`<div class="rt">${esc(c.t)}${c.byId===MY_ID?'<span class="mytag">YOURS</span>':''}</div>`+
          `<div class="rm">${t12(c.s)} – ${t12(c.e)}</div>`+
          (span>1?`<div class="rw">${esc(c.host)} · ${esc(c.dept)}</div>`:'');
        el.addEventListener('click',()=>openDetail(c));
        sheet.appendChild(el);
      }else{
        const gone = shut || isPast(ds) || (isToday(ds)&&mm<m);
        const el=document.createElement('button');
        el.className='cell'+(mm%60===0?' hr':'')+(gone?' gone':'');
        el.style.gridColumn=ci+2; el.style.gridRow=i+2;
        el.setAttribute('aria-label',gone?'Not available':`Book ${r.n} at ${t12(mm)}`);
        if(gone) el.disabled=true;
        else el.addEventListener('click',()=>startWizard({room:r.id,date:ds,entry:mm}));
        sheet.appendChild(el);
      }
    });
  });

  const nl=document.getElementById('nowline');
  if(isToday(ds)&&!shut&&m>=OPEN&&m<SHUT){
    const h=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot-h'));
    const head=document.querySelector('.hcell')?.offsetHeight||48;
    nl.style.display='block'; nl.style.top=(head+((m-OPEN)/STEP)*h)+'px';
  } else nl.style.display='none';
}

/* ================= wizard ================= */
const STEPS=[['Which room?','Step 1 of 6'],['Which day?','Step 2 of 6'],
             ['Select the starting time','Step 3 of 6'],['Select the ending time','Step 4 of 6'],
             ['Meeting details','Step 5 of 6'],['Check and confirm','Step 6 of 6']];
let W=null;

function startWizard(pre){
  const ds=pre?.date??iso(cursor);
  W={step:1,room:pre?.room??null,date:ds,entry:pre?.entry??null,exit:null,
     dept:DEPTS[0]||'',host:ME,att:[],title:'',note:'',cap:null,capFor:null};
  /* Tapping a cell already answers room, day and start: jump to the end time. */
  if(W.room&&W.entry!=null){ W.step=4; loadCap().then(()=>{ if(W) paintWiz(); }); }
  paintWiz(); open_(document.getElementById('wiz'));
}

const entryOk=v=> v>=OPEN && v<=SHUT-MINLEN && !blockedAt(W.room,W.date,v)
                  && !(isToday(W.date)&&v<nowM()) && !dayShut(W.date);
const exitOk=v=> W.entry!=null && v>W.entry && v-W.entry>=MINLEN
                 && v<=capAfter(W.room,W.date,W.entry);

function paintWiz(){
  document.getElementById('rail').innerHTML=STEPS.map((_,i)=>
    `<i class="${i+1<W.step?'done':i+1===W.step?'at':''}"></i>`).join('');
  document.getElementById('stTitle').textContent=STEPS[W.step-1][0];
  document.getElementById('stSub').textContent=STEPS[W.step-1][1];
  document.getElementById('wBack').style.visibility=W.step===1?'hidden':'visible';
  const B=document.getElementById('stBody');
  B.innerHTML='';
  ({1:step1,2:step2,3:step3,4:step4,5:step5,6:step6})[W.step](B);
  const nx=document.getElementById('wNext');
  nx.textContent=W.step===6?'Confirm booking':'Next';
  nx.disabled=!stepValid();
}

function stepValid(){
  if(W.step===1) return !!W.room;
  if(W.step===2) return !!W.date && !dayShut(W.date) && !beyondWindow(W.date);
  if(W.step===3) return W.entry!=null && entryOk(W.entry);
  if(W.step===4) return W.exit!=null && exitOk(W.exit);
  if(W.step===5) return !!W.dept && !!W.host;
  return true;
}

/* --- step 1: room --- */
function step1(B){
  B.innerHTML=`<div class="rlist">`+ROOMS.map(r=>`
    <button class="rpick" style="--c:var(${r.v})" data-r="${r.id}" aria-pressed="${W.room===r.id}">
      <span><b>${esc(r.n)}</b><span class="cap">Best for ${r.min} or more people</span></span>
      <span class="tick">✓</span>
    </button>`).join('')+`</div>
    <div class="capnote" id="capnote"></div>`;
  const note=B.querySelector('#capnote');
  const paintNote=()=>{
    const r=room(W.room);
    if(!r){ note.classList.remove('on'); return; }
    note.textContent=`${r.n} should only be selected if you are ${r.min} or more people.`;
    note.classList.add('on');
  };
  paintNote();
  B.querySelectorAll('.rpick').forEach(b=>b.addEventListener('click',()=>{
    W.room=b.dataset.r; W.entry=null; W.exit=null; W.cap=null; W.capFor=null; paintWiz();
  }));
}

/* --- step 2: a real calendar, limited to the booking window --- */
function step2(B){
  const start=today(), last=LAST_DATE?fromIso(LAST_DATE):addDays(start,6);
  const first=new Date(start.getFullYear(),start.getMonth(),1);
  const monthLabel=d=>d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});

  /* Show the month that contains the window; if it spills over, show both. */
  const months=[];
  let cur=new Date(first);
  while(cur<=last){ months.push(new Date(cur)); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); }

  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cells=(monthStart)=>{
    const y=monthStart.getFullYear(), mo=monthStart.getMonth();
    const daysIn=new Date(y,mo+1,0).getDate();
    const lead=(new Date(y,mo,1).getDay()+6)%7;   /* Monday-first */
    let html='';
    for(let i=0;i<lead;i++) html+=`<button class="day pad" disabled></button>`;
    for(let dnum=1;dnum<=daysIn;dnum++){
      const d=new Date(y,mo,dnum), ds=iso(d);
      const closed=weekendShut(ds), past=isPast(ds), far=beyondWindow(ds);
      const usable=!closed&&!past&&!far;
      const label=closed?'<em>Closed</em>':'';
      html+=`<button class="day ${usable?'free':''} ${closed?'shut':''}" data-d="${ds}"
        aria-pressed="${W.date===ds}" ${usable?'':'disabled'}>${dnum}${label}</button>`;
    }
    return html;
  };

  B.innerHTML=months.map(mo=>`
    <div class="tsec">
      <h4>${monthLabel(mo)}</h4>
      <div class="cal">
        <div class="calhead">${dayNames.map(n=>`<span>${n}</span>`).join('')}</div>
        <div class="calgrid">${cells(mo)}</div>
      </div>
    </div>`).join('')+
    `<div class="hint">You can book <b>today and the next ${Math.max(0,(fromIso(LAST_DATE||iso(addDays(start,6)))-start)/86400000)} days</b>.
     Sundays and holidays are closed.</div>`;

  B.querySelectorAll('.day[data-d]:not([disabled])').forEach(b=>
    b.addEventListener('click',async()=>{
      W.date=b.dataset.d; W.entry=null; W.exit=null; W.cap=null; W.capFor=null;
      await ensureDay(W.date); paintWiz();
    }));
}

/* --- steps 3 and 4: fixed time buttons, never a clock --- */
function timeButtons(B,{values,chosen,okFn,onPick,emptyMsg,subLabel}){
  if(!values.length){ B.innerHTML=`<div class="hint">${emptyMsg}</div>`; return; }
  const groups=[['Morning',v=>v<12*60],['Afternoon',v=>v>=12*60&&v<17*60],['Evening',v=>v>=17*60]];
  let html='';
  groups.forEach(([label,test])=>{
    const inGroup=values.filter(test);
    if(!inGroup.length) return;
    html+=`<div class="tsec"><h4>${label}</h4><div class="times">`+
      inGroup.map(v=>`<button class="t" data-v="${v}" aria-pressed="${chosen===v}"
        ${okFn(v)?'':'disabled'}>${t12(v)}${subLabel?`<small>${subLabel(v)}</small>`:''}</button>`).join('')+
      `</div></div>`;
  });
  B.innerHTML=html;
  B.querySelectorAll('.t:not([disabled])').forEach(b=>
    b.addEventListener('click',()=>onPick(+b.dataset.v)));
}

function step3(B){
  const r=room(W.room);
  timeButtons(B,{
    values:SLOTS.filter(v=>v<=SHUT-MINLEN),
    chosen:W.entry, okFn:entryOk,
    onPick:v=>{ W.entry=v; W.exit=null; W.cap=null; W.capFor=null; paintWiz(); },
    emptyMsg:'Nothing is free on this day.'
  });
  const runs=runsFor(W.room,W.date);
  const hint=document.createElement('div');
  hint.className='hint';
  hint.innerHTML = runs.length
    ? `<b>${esc(r.n)}</b> is already taken ${runs.map(b=>`${t12(b.s)}–${t12(b.e)}`).join(', ')}. Those times are greyed out.`
    : `<b>${esc(r.n)}</b> has nothing booked on this day.`;
  B.appendChild(hint);
}

function step4(B){
  const cap=capAfter(W.room,W.date,W.entry);
  const values=[];
  for(let v=W.entry+MINLEN;v<=cap;v+=STEP) values.push(v);
  timeButtons(B,{
    values, chosen:W.exit, okFn:exitOk,
    onPick:v=>{ W.exit=v; paintWiz(); },
    emptyMsg:'There is no room left after that start time. Go back and pick an earlier one.',
    subLabel:v=>{const mins=v-W.entry;return mins%60?`${(mins/60).toFixed(1)} hr`:`${mins/60} hr`;}
  });
  const nxt=runsFor(W.room,W.date).find(b=>b.s>=W.entry);
  const hint=document.createElement('div');
  hint.className='hint';
  hint.innerHTML=`Starts at <b>${t12(W.entry)}</b>. You can run to <b>${t12(cap)}</b>`+
    (nxt&&cap===nxt.s?`, because ${esc(room(W.room).n)} is taken from then.`:` — four hours is the maximum.`);
  B.appendChild(hint);
}

/* --- step 5: details --- */
function step5(B){
  B.innerHTML=`
   <div class="f"><label for="wT">What is the meeting?</label>
     <input id="wT" type="text" maxlength="90" placeholder="Sales review" value="${esc(W.title)}">
     <div class="sub">Leave it blank and it will just say “Meeting”.</div></div>
   <div class="f"><label for="wD">Department</label>
     <select id="wD">${DEPTS.map(d=>`<option ${d===W.dept?'selected':''}>${esc(d)}</option>`).join('')}</select></div>
   <div class="f"><label for="wH">Who is running the meeting?</label>
     <select id="wH">${DIR.map(p=>`<option ${p===W.host?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
   <div class="f"><label for="wA">Anyone else coming?</label>
     <input id="wA" type="text" placeholder="Type a name and press Enter" list="dirL" autocomplete="off">
     <datalist id="dirL">${DIR.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
     <div class="tags" id="wTags"></div></div>
   <div class="f"><label for="wN">Anything the room needs?</label>
     <textarea id="wN" placeholder="Projector, tea for 6, U-shape seating…">${esc(W.note)}</textarea></div>`;
  B.querySelector('#wT').addEventListener('input',e=>W.title=e.target.value);
  B.querySelector('#wD').addEventListener('change',e=>{W.dept=e.target.value;});
  B.querySelector('#wH').addEventListener('change',e=>{W.host=e.target.value;});
  B.querySelector('#wN').addEventListener('input',e=>W.note=e.target.value);
  const ai=B.querySelector('#wA');
  ai.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault();
      const v=ai.value.trim();
      if(v&&DIR_ID[v]!=null&&!W.att.includes(v)) W.att.push(v);
      else if(v&&DIR_ID[v]==null) toast(`${v} is not in the directory.`,true);
      ai.value=''; tags(); }
  });
  function tags(){
    B.querySelector('#wTags').innerHTML=W.att.map((a,i)=>
      `<span class="tag">${esc(a)}<button data-i="${i}" aria-label="Remove ${esc(a)}">×</button></span>`).join('');
    B.querySelectorAll('#wTags button').forEach(b=>
      b.addEventListener('click',()=>{W.att.splice(+b.dataset.i,1);tags();}));
  }
  tags();
}

/* --- step 6: review --- */
function step6(B){
  const d=fromIso(W.date), r=room(W.room);
  const mins=W.exit-W.entry;
  B.innerHTML=`<div class="rev">
    <div class="row"><span class="k">Room</span><span class="v"><b>${esc(r.n)}</b> <span style="color:var(--muted)">· best for ${r.min}+</span></span></div>
    <div class="row"><span class="k">Date</span><span class="v">${d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</span></div>
    <div class="row"><span class="k">Time</span><span class="v"><b>${t12(W.entry)} to ${t12(W.exit)}</b> · ${mins%60?(mins/60).toFixed(1):mins/60} hr</span></div>
    <div class="row"><span class="k">Meeting</span><span class="v">${esc(W.title||'Meeting')}</span></div>
    <div class="row"><span class="k">Department</span><span class="v">${esc(W.dept)}</span></div>
    <div class="row"><span class="k">Run by</span><span class="v">${esc(W.host)}</span></div>
    <div class="row"><span class="k">Also coming</span><span class="v">${W.att.length?W.att.map(esc).join(', '):'Nobody added'}</span></div>
    ${W.note?`<div class="row"><span class="k">Room needs</span><span class="v">${esc(W.note)}</span></div>`:''}
  </div>
  <div class="notice"><b>Who gets told</b><ul>
    <li>${W.att.length?W.att.length+' other'+(W.att.length>1?'s':''):'Anyone you add'}</li>
    <li>${esc(W.host)} — running it</li>
    <li>Reception, Mumbai</li>
    <li>The Mumbai branch group, in tomorrow's 8 am summary</li>
  </ul></div>`;
}

async function loadCap(){
  if(!W||W.entry==null||!W.room) return;
  W.cap=null; W.capFor=null;
  try{
    const r=await api(`/availability/exit-cap?room=${encodeURIComponent(W.room)}&date=${W.date}&entry=${t24(W.entry)}`);
    W.cap=hhmm(r.exit_cap); W.capFor=`${W.room}|${W.date}|${W.entry}`;
  }catch(e){ /* the local rule is the same computation */ }
}

/* --- navigation --- */
document.getElementById('wBack').addEventListener('click',()=>{ if(W.step>1){W.step--;paintWiz();} });
document.getElementById('wNext').addEventListener('click',async()=>{
  if(!stepValid()) return;
  const nx=document.getElementById('wNext');
  if(W.step<6){
    W.step++;
    if(W.step===4) await loadCap();
    paintWiz(); return;
  }
  nx.disabled=true;
  try{
    await api('/bookings',{method:'POST',body:JSON.stringify({
      room_id:W.room, date:W.date, entry:t24(W.entry), exit:t24(W.exit),
      department_id:DEPT_ID[W.dept]??null, conducted_by:DIR_ID[W.host]??null,
      attendee_ids:W.att.map(n=>DIR_ID[n]).filter(v=>v!=null),
      title:W.title.trim(), reception_note:W.note.trim()||null})});
    /* shut_() clears W, so everything the toast and the grid need is read first. */
    const r=room(W.room), s=W.entry, e=W.exit, when=W.date;
    shut_(); cursor=fromIso(when); await refresh();
    toast(`${r.n} is yours, ${t12(s)} to ${t12(e)}. Everyone invited has been told.`);
  }catch(e){
    nx.disabled=false;
    if(e.status===409){
      W.step=1; W.entry=null; W.exit=null; W.cap=null; W.capFor=null;
      await loadDay(W.date,true); render(); paintWiz();
    }
    toast(e.message,true);
  }
});

/* ================= detail + cancel ================= */
let dropId=null, dropCan=false;
async function openDetail(b){
  let d;
  try{ d=await api(`/bookings/${b.id}`); }catch(e){ toast(e.message,true); return; }
  dropId=d.id; dropCan=d.can_cancel;
  const att=d.attendees.map(a=>a.full_name);
  document.getElementById('dh').textContent=d.title;
  document.getElementById('dsub').textContent=`${d.room_name} · ${t12(hhmm(d.entry))} – ${t12(hhmm(d.exit))}`;
  document.getElementById('dBody').innerHTML=`<dl>
    <dt>When</dt><dd>${fromIso(d.date).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}<br>${t12(hhmm(d.entry))} to ${t12(hhmm(d.exit))}</dd>
    <dt>Room</dt><dd>${esc(d.room_name)}</dd>
    <dt>Department</dt><dd>${esc(d.department)}</dd>
    <dt>Run by</dt><dd>${esc(d.host)}${d.host===ME?' <span class="pill">you</span>':''}</dd>
    <dt>Also coming</dt><dd>${att.length?att.map(esc).join(', '):'Nobody added'}</dd>
    ${d.reception_note?`<dt>Room needs</dt><dd>${esc(d.reception_note)}</dd>`:''}
    <dt>Booked by</dt><dd>${esc(d.booked_by)}${d.booked_by_id===MY_ID?' <span class="pill">you</span>':''}</dd></dl>`;
  const dr=document.getElementById('drop');
  dr.dataset.armed='0'; dr.classList.remove('armed');
  dr.style.display=d.can_cancel?'':'none';
  dr.textContent='Cancel booking';
  open_(document.getElementById('det'));
}

document.getElementById('drop').addEventListener('click',async ev=>{
  const dr=ev.currentTarget, b=bookings.find(x=>x.id===dropId);
  if(!b||!dropCan) return;
  if(dr.dataset.armed!=='1'){
    dr.dataset.armed='1'; dr.classList.add('armed'); dr.textContent='Tap again to confirm';
    toast(`This frees ${room(b.room).n} and tells everyone the meeting is off.`);
    return;
  }
  dr.disabled=true;
  try{
    await api(`/bookings/${b.id}/cancel`,{method:'POST'});
    shut_(); await refresh();
    toast(`Cancelled. ${room(b.room).n} is free again ${t12(b.s)} to ${t12(b.e)}.`);
  }catch(e){ toast(e.message,true); }
  dr.disabled=false;
});

/* ================= plumbing ================= */
const veil=document.getElementById('veil');
const open_=p=>{veil.classList.add('on');p.classList.add('on');document.body.style.overflow='hidden';};
function shut_(){
  veil.classList.remove('on');
  document.querySelectorAll('.pan').forEach(p=>p.classList.remove('on'));
  document.body.style.overflow='';
  const dr=document.getElementById('drop');
  dr.dataset.armed='0'; dr.classList.remove('armed'); dr.textContent='Cancel booking';
  W=null;
}
veil.addEventListener('click',shut_);
document.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',shut_));
document.addEventListener('keydown',e=>{if(e.key==='Escape')shut_();});

document.getElementById('prev').addEventListener('click',()=>{cursor=addDays(cursor,-1);refresh();});
document.getElementById('next').addEventListener('click',()=>{cursor=addDays(cursor,1);refresh();});
document.getElementById('today').addEventListener('click',()=>{cursor=today();refresh();});
document.getElementById('newBtn').addEventListener('click',()=>startWizard({date:iso(cursor)}));
document.getElementById('signout').addEventListener('click',async()=>{
  try{ await api('/auth/logout',{method:'POST'}); }catch(e){}
  location.replace('/login.html');
});

let tt;
function toast(msg,bad){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.toggle('bad',!!bad); el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),bad?6000:4500);
}

boot();
setInterval(()=>{ if(!document.querySelector('.pan.on')) refresh(); },60000);
</script>
