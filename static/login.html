<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — NM Meet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Exactly the prototype's variables, values and idioms. Nothing new is invented
   here: the panel header, the .f field, the .act.go button and the .notice box
   are all lifted from nm-meet-web_1.html so the screen belongs to NM Meet. */
:root{
  --panel:#15161A; --panel-2:#1F2127;
  --paper:#E9EDF2; --card:#FFF; --tint:#E2E7EE;
  --ink:#16181C; --ink-2:#4A5058; --muted:#878D97;
  --rule:#D8DEE6; --rule-2:#E7EBF0;
  --brass:#F5A300; --brass-deep:#B87700;
  --navy:#13315C; --navy-2:#2A4A78;
  --ok:#0E9C92; --no:#DD4F3A;
  --gut:28px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--gut);width:100%}

/* header — identical to the grid's */
.top{background:var(--panel);color:#E8E6E1}
.topin{display:flex;align-items:center;gap:11px;padding:15px 0 16px}
.bolt{width:21px;height:21px;border-radius:4px;background:var(--brass);display:grid;place-items:center;color:#171208;font-size:12px;font-weight:700}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.09em;text-transform:uppercase}
.topin .sp{flex:1}
.stamp{font-family:"Azeret Mono",monospace;font-size:10px;color:#7F8794;letter-spacing:.08em}

main{flex:1;display:grid;place-items:center;padding:40px var(--gut)}
.box{background:var(--card);border:1px solid var(--rule);width:min(392px,100%)}
.ph{background:var(--panel);color:#E8E6E1;padding:15px 22px 14px}
.ph h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.1em}
.ph p{margin:3px 0 0;font-family:"Azeret Mono",monospace;font-size:10px;color:#868D99;letter-spacing:.05em}
.pb{padding:18px 22px}
.pf{padding:13px 22px;border-top:1px solid var(--rule);background:#FAFBFC}

.f{margin-bottom:15px}
.f label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px}
.f input{width:100%;border:1px solid var(--rule);border-radius:2px;padding:10px 11px;
  font:inherit;font-size:14.5px;background:var(--card);color:var(--ink)}
.f input:focus{outline:none;border-color:var(--brass)}

.act{border:1px solid var(--rule);background:var(--card);border-radius:3px;padding:11px 17px;font-size:14.5px;font-weight:500}
.act.go{width:100%;background:var(--brass);border-color:var(--brass);color:#1A1305;font-weight:600;box-shadow:0 1px 0 var(--brass-deep)}
.act.go:hover{background:#FFB01A}
.act.go[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}

.notice{border:1px solid var(--rule);border-left:3px solid var(--no);background:#FFF7F5;padding:11px 14px;margin-bottom:15px;font-size:13.5px;color:var(--ink-2);display:none}
.notice.on{display:block}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.45}
footer{padding:18px var(--gut);color:var(--muted);font-size:12px}
@media (max-width:820px){:root{--gut:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap"><div class="topin">
  <span class="bolt">⌁</span><span class="brand">NM Meet</span>
  <span class="sp"></span><span class="stamp" id="stamp"></span>
</div></div></header>

<main>
  <form class="box" id="form" autocomplete="on">
    <div class="ph"><h1>Sign in</h1><p>Mumbai branch</p></div>
    <div class="pb">
      <div class="notice" id="err" role="alert"></div>
      <div class="f">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      </div>
      <div class="f">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="act go" id="go" type="submit">Sign in</button>
    </div>
    <div class="pf">
      <p class="hint">Ask reception or an administrator if you do not have a password yet.</p>
    </div>
  </form>
</main>

<footer>Shree NM · Mumbai branch</footer>

<script>
document.getElementById('stamp').textContent =
  new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()+' · MUMBAI';

const form=document.getElementById('form'), err=document.getElementById('err'), go=document.getElementById('go');

/* Already signed in? Go straight to the grid. */
fetch('/api/me').then(r=>{ if(r.ok) location.replace('/'); }).catch(()=>{});

function fail(msg){ err.textContent=msg; err.classList.add('on'); }

form.addEventListener('submit',async e=>{
  e.preventDefault();
  err.classList.remove('on');
  go.disabled=true; go.textContent='Signing in…';
  try{
    const res=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        email:document.getElementById('email').value,
        password:document.getElementById('password').value})});
    let body=null; try{ body=await res.json(); }catch(_){}
    if(!res.ok){
      fail((body&&body.detail)||'NM Meet is not reachable right now. Try again in a moment.');
      go.disabled=false; go.textContent='Sign in'; return;
    }
    const next=new URLSearchParams(location.search).get('next');
    location.replace(next&&next.startsWith('/')?next:'/');
  }catch(_){
    fail('NM Meet is not reachable right now. Try again in a moment.');
    go.disabled=false; go.textContent='Sign in';
  }
});
</script>
</body>
</html>
