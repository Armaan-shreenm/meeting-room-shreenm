<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17171C">
<title>Sign in - NM Meet</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#F5A300; --brand-600:#DB9100; --brand-200:#FFE2A6; --brand-50:#FFF7E6;
  --ink:#1B1A17; --ink-2:#55524B; --muted:#8C8880;
  --page:#FAF8F5; --card:#FFFFFF; --sunk:#F2EFEA; --line:#E9E4DC;
  --dark:#17171C; --no:#D6452F;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --ease:cubic-bezier(.4,0,.2,1);
  --gut:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 var(--gut)}

.top{background:var(--dark);color:#F3F1EC}
.topin{display:flex;align-items:center;gap:10px;padding:14px 0}
.mark{height:26px;width:auto;display:block}
.cardmark{height:46px;width:auto;display:block;margin-bottom:14px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}

main{flex:1;display:grid;place-items:center;padding:40px var(--gut)}
.box{background:var(--card);border:1px solid var(--ink);border-radius:var(--r-lg);
  width:min(400px,100%);overflow:hidden}
.bh{padding:26px 26px 4px}
.bh h1{margin:0;font-size:23px;font-weight:650;letter-spacing:-.02em}
.bh p{margin:5px 0 0;font-size:14px;color:var(--muted)}
.bb{padding:20px 26px 26px}

.f{margin-bottom:15px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.f input{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;
  font-size:15px;background:var(--card);transition:.16s var(--ease)}
.f input:focus{outline:none;border-color:var(--ink)}

.go{width:100%;background:var(--brand);border:1px solid var(--ink);border-radius:var(--r);
  padding:13px;color:#241800;font-weight:650;font-size:15px;
  transition:background .18s var(--ease)}
.go:hover:not(:disabled){background:#FFB524}
.go:disabled{opacity:.5;cursor:not-allowed}

.err{border:1px solid #F3C9C0;background:#FFF5F3;border-left:3px solid var(--no);
  border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px;font-size:13.5px;color:#8C2A19;display:none}
.err.on{display:block}

/* Google button - hidden until GOOGLE_CLIENT_ID is configured. */
.gwrap{display:none}
.gwrap.on{display:block}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px;
  font-size:15px;font-weight:600;transition:.18s var(--ease);text-decoration:none;color:var(--ink)}
.gbtn:hover{background:var(--sunk);border-color:var(--ink-2)}
.sep{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}

.foot{padding:14px 26px;border-top:1px solid var(--line);background:#FCFBF9;
  font-size:13px;color:var(--muted);line-height:1.45}
footer{padding:18px var(--gut);color:var(--muted);font-size:12.5px}
@media (max-width:760px){:root{--gut:14px}main{padding:24px var(--gut)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="wrap"><div class="topin">
  <img class="mark" src="/logo.png" alt="Shree NM"><span class="brand">NM Meet</span>
</div></div></header>

<main>
  <form class="box" id="form" autocomplete="on">
    <div class="bh">
      <img class="cardmark" src="/logo.png" alt="Shree NM">
      <h1>Sign in</h1>
      <p>Book a meeting room at the Mumbai branch.</p>
    </div>
    <div class="bb">
      <div class="err" id="err" role="alert"></div>

      <!-- Shown only once GOOGLE_CLIENT_ID is set. The backend is complete. -->
      <div class="gwrap" id="gwrap">
        <a class="gbtn" id="gbtn" href="/api/auth/google/start">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.8 2.6 13.6l7.8 6c1.9-5.7 7.2-10.1 13.6-10.1z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.700 7.1-17.6z"/>
            <path fill="#FBBC05" d="M10.4 28.4c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4l-7.8-6C.9 16.7 0 20.2 0 24s.9 7.3 2.6 10.4l7.8-6z"/>
            <path fill="#34A853" d="M24 47.5c6.2 0 11.5-2 15.4-5.5l-7.6-5.9c-2.1 1.4-4.8 2.3-7.8 2.3-6.4 0-11.7-4.3-13.6-10.1l-7.8 6C6.5 42.2 14.6 47.5 24 47.5z"/>
          </svg>
          Continue with Google
        </a>
        <div class="sep">or</div>
      </div>

      <div class="f">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus
               placeholder="you@shreenm.com">
      </div>
      <div class="f">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="go" id="go" type="submit">Sign in</button>
    </div>
    <div class="foot" id="foot">Ask IT if you do not have a password yet.</div>
  </form>
</main>

<footer>Shree NM · Mumbai branch</footer>

<script>
const form=document.getElementById('form'), err=document.getElementById('err'), go=document.getElementById('go');
const fail=m=>{err.textContent=m;err.classList.add('on');};

/* A failed Google round trip redirects back here with the reason. */
const params=new URLSearchParams(location.search);
if(params.get('error')) fail(params.get('error'));

/* Already signed in? Straight to the grid. */
fetch('/api/me',{credentials:'same-origin'}).then(r=>{ if(r.ok) location.replace('/'); }).catch(()=>{});

/* Show the Google button only when the server says it is configured. */
fetch('/api/auth/google/status',{credentials:'same-origin'})
  .then(r=>r.ok?r.json():null)
  .then(s=>{
    if(!s||!s.configured) return;
    document.getElementById('gbtn').href=s.start_url;
    document.getElementById('gwrap').classList.add('on');
    document.getElementById('foot').textContent=
      `Use your @${s.domain} Google account.`;
  }).catch(()=>{});

form.addEventListener('submit',async e=>{
  e.preventDefault();
  err.classList.remove('on');
  go.disabled=true; go.textContent='Signing in…';
  try{
    const res=await fetch('/api/auth/login',{
      method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        email:document.getElementById('email').value,
        password:document.getElementById('password').value})});
    let body=null; try{ body=await res.json(); }catch(_){}
    if(!res.ok){
      fail((body&&body.detail)||'NM Meet is not reachable right now. Try again in a moment.');
      go.disabled=false; go.textContent='Sign in'; return;
    }
    const next=params.get('next');
    location.replace(next&&next.startsWith('/')?next:'/');
  }catch(_){
    fail('NM Meet is not reachable right now. Try again in a moment.');
    go.disabled=false; go.textContent='Sign in';
  }
});
</script>
</body>
</html>
