# =============================================================================
# NM Meet - Render Blueprint.
#
# One web service and one managed PostgreSQL database, both on free plans.
# Everything below is free-tier compatible: no preDeployCommand, no disks, no
# private services, no cron jobs, one worker.
#
# This file must sit at the root of the GitHub repository for Render to find it.
# =============================================================================

databases:
 - name: nm-meet-db
    databaseName: nm_meet
    user: nm_meet
    plan: free
    # Singapore is Render's closest region to Mumbai. The web service below must
    # be in the same region or it cannot reach the database on the internal network.
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []          # internal connections only; nothing exposed publicly

services:
 - type: web
    name: nm-meet
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true

    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"

    # Migrations, then the seed, then the server. start.sh exits non-zero if the
    # migration fails, which fails the deploy instead of serving a stale schema.
    # Invoked through bash so a lost executable bit on a Windows checkout cannot
    # break the deploy.
    startCommand: "bash ./start.sh"

    # Render polls this. It answers 503 when the database is unreachable, so a
    # deploy that cannot see its database never goes live.
    healthCheckPath: /api/health

    envVars:
      # ---- wired from the managed database above ----------------------------
      # Render supplies this as postgres://... ; config.py rewrites the scheme
      # to postgresql+psycopg2:// before SQLAlchemy ever sees it.
     - key: DATABASE_URL
        fromDatabase:
          name: nm-meet-db
          property: connectionString

      # ---- runtime ----------------------------------------------------------
     - key: ENVIRONMENT
        value: production
     - key: PYTHON_VERSION
        value: 3.11.9
     - key: LOG_LEVEL
        value: INFO
     - key: SQL_ECHO
        value: "false"
      # Log straight to stdout, unbuffered. The filesystem is ephemeral.
     - key: PYTHONUNBUFFERED
        value: "1"

      # ---- authentication ---------------------------------------------------
      # Signs the session cookie. Render generates a strong value on first
      # deploy and keeps it; it is never in git. Rotating it signs everyone out.
     - key: SECRET_KEY
        generateValue: true
      # One working day.
     - key: SESSION_MAX_AGE_SECONDS
        value: "43200"
      # Sign-in passwords for seeded accounts. Leave unset so each account gets
      # its own random password, printed once in the deploy log.
     - key: SEED_PASSWORD
        sync: false
      # Used to build the "view or cancel" link in every notification.
     - key: PUBLIC_BASE_URL
        sync: false

      # ---- Google Sign-In ---------------------------------------------------
      # Backend complete; the button appears on the login page once these are
      # set. Register the redirect URI in the Google Cloud console to match.
     - key: GOOGLE_CLIENT_ID
        sync: false
     - key: GOOGLE_CLIENT_SECRET
        sync: false
     - key: GOOGLE_REDIRECT_URI
        sync: false
     - key: ALLOWED_EMAIL_DOMAIN
        value: shreenm.com

      # ---- branch and locale ------------------------------------------------
     - key: TZ
        value: Asia/Kolkata
     - key: BRANCH_NAME
        value: Mumbai

      # ---- booking rules (spec sections 3 and 4, section 13 as settled) ------
     - key: OPEN_TIME
        value: "10:00"
     - key: CLOSE_TIME
        value: "19:00"
     - key: SLOT_MINUTES
        value: "30"
     - key: MIN_BOOKING_MINUTES
        value: "30"
     - key: MAX_BOOKING_MINUTES
        value: "240"
      # Counting today: 7 means today and the next six days.
     - key: MAX_ADVANCE_DAYS
        value: "7"
     - key: NO_SHOW_RELEASE_MINUTES
        value: "15"
      # Monday=0 ... Sunday=6. D-03: Monday to Saturday working, Sunday closed.
     - key: CLOSED_WEEKDAYS
        value: "[6]"

      # ---- notifications ----------------------------------------------------
      # Left off until real SMTP credentials exist. SMTP_USER and SMTP_PASSWORD
      # are marked sync:false so they are entered in the Render dashboard and are
      # never written into this file or into git.
     - key: NOTIFICATIONS_ENABLED
        value: "false"
     - key: SMTP_HOST
        sync: false
     - key: SMTP_PORT
        value: "587"
     - key: SMTP_USER
        sync: false
     - key: SMTP_PASSWORD
        sync: false
     - key: SMTP_STARTTLS
        value: "true"
     - key: SMTP_FROM_EMAIL
        sync: false
     - key: SMTP_FROM_NAME
        value: NM Meet
     - key: RECEPTION_EMAIL
        sync: false
     - key: MUMBAI_GROUP_EMAIL
        sync: false
     - key: DAILY_SUMMARY_HOUR
        value: "8"
     - key: CALENDAR_INVITE_ENABLED
        value: "true"

  # ===========================================================================
  # D-01 - the Mumbai branch group's daily 8 am summary.
  #
  # A separate cron job, deliberately NOT an in-process scheduler. The web
  # service sleeps after fifteen minutes of inactivity on the free plan, so a
  # background thread inside it cannot be relied on to be awake at 08:00 IST.
  # Render starts this container on schedule, runs it to completion and stops it.
  #
  # schedule is UTC: 02:30 UTC == 08:00 Asia/Kolkata (UTC+5:30), all year, since
  # India observes no daylight saving.
  #
  # NOTE: cron jobs are a PAID Render feature. On the free plan this service is
  # ignored; run `python -m scripts.daily_summary` from any scheduler, or by
  # hand, until the account is upgraded. See HANDOVER.md.
  # ===========================================================================
 - type: cron
    name: nm-meet-daily-summary
    runtime: python
    plan: starter
    region: singapore
    branch: main
    schedule: "30 2 * * 1-6"          # Mon-Sat, 08:00 IST. Sunday is closed.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m scripts.daily_summary"
    envVars:
     - key: DATABASE_URL
        fromDatabase:
          name: nm-meet-db
          property: connectionString
     - key: ENVIRONMENT
        value: production
     - key: PYTHON_VERSION
        value: 3.11.9
     - key: PYTHONUNBUFFERED
        value: "1"
     - key: TZ
        value: Asia/Kolkata
     - key: BRANCH_NAME
        value: Mumbai
      # The summary must be able to sign its own messages and address them.
     - key: SECRET_KEY
        generateValue: true
     - key: PUBLIC_BASE_URL
        sync: false
     - key: NOTIFICATIONS_ENABLED
        value: "false"
     - key: SMTP_HOST
        sync: false
     - key: SMTP_PORT
        value: "587"
     - key: SMTP_USER
        sync: false
     - key: SMTP_PASSWORD
        sync: false
     - key: SMTP_STARTTLS
        value: "true"
     - key: SMTP_FROM_EMAIL
        sync: false
     - key: SMTP_FROM_NAME
        value: NM Meet
     - key: RECEPTION_EMAIL
        sync: false
     - key: MUMBAI_GROUP_EMAIL
        sync: false
